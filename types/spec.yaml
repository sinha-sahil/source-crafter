info:
  version: 0.1.0
  title: Orrery Engine Types

types:
  # ── Enums ──

  Direction:
    type: string
    description: Layout direction for a region
    enum:
      - vertical
      - horizontal
      - grid

  Justify:
    type: string
    description: Content justification within a region
    enum:
      - start
      - center
      - end
      - space-between

  EventType:
    type: string
    description: Standard event types mapped to library-specific prop names by the adapter
    enum:
      - click
      - input
      - change
      - submit
      - focus
      - blur

  ActionType:
    type: string
    description: Built-in action types the engine can execute
    enum:
      - show
      - hide
      - toggle
      - navigate
      - back
      - notify
      - scroll-to
      - focus
      - enable
      - disable
      - update
      - reset
      - fetch
      - refresh
      - update-region
      - update-props
      - multiple
      - handler

  # ── Core Structures ──

  PageTree:
    type: object
    description: Top-level parsed YAML template
    required:
      - page
      - regions
    properties:
      page:
        type: string
      regions:
        type: object
        additionalProperties:
          $ref: '#/types/Region'
      style:
        $ref: '#/types/StyleTokens'
      data:
        $ref: '#/types/DataDeclarations'
      interactions:
        type: array
        items:
          $ref: '#/types/Interaction'

  Region:
    type: object
    description: A named layout container that holds components or sub-regions
    properties:
      id:
        type: string
      direction:
        $ref: '#/types/Direction'
      gap:
        type: number
      justify:
        $ref: '#/types/Justify'
      span:
        type: number
      columns:
        type: number
      layer:
        type: number
      collapse-below:
        type: number
      stack-below:
        type: number
      regions:
        type: object
        additionalProperties:
          $ref: '#/types/Region'
      components:
        type: array
        items:
          $ref: '#/types/Component'
      style:
        $ref: '#/types/StyleBlock'

  Component:
    type: object
    description: A renderable UI component with type, props, and optional layout/style
    required:
      - type
    properties:
      type:
        type: string
      id:
        type: string
      props:
        $ref: '#/types/Props'
      data:
        type: string
      span:
        type: number
      colSpan:
        type: number
      rowSpan:
        type: number
      style:
        $ref: '#/types/StyleBlock'

  Interaction:
    type: object
    description: Maps a component event to a built-in action or handler
    required:
      - 'on'
    properties:
      'on':
        type: string
      do:
        type: string
      target:
        type: string
      handler:
        type: string
      to:
        type: string
      message:
        type: string

  # ── Actions ──

  Action:
    type: object
    description: An action the engine executes (built-in or returned by handler)
    required:
      - type
    properties:
      type:
        $ref: '#/types/ActionType'
      target:
        type: string
      to:
        type: string
      message:
        type: string
      variant:
        type: string
      props:
        $ref: '#/types/Props'
      components:
        type: array
        items:
          $ref: '#/types/Component'
      actions:
        type: array
        items:
          $ref: '#/types/Action'
      data:
        type: object
        additionalProperties: true

  # ── Splitter Output ──

  LayoutNode:
    type: object
    description: Layout-only view of a region — no component props
    required:
      - name
      - direction
      - gap
      - justify
      - span
      - layer
    properties:
      name:
        type: string
      id:
        type: string
      direction:
        $ref: '#/types/Direction'
      gap:
        type: number
      justify:
        $ref: '#/types/Justify'
      span:
        type: number
      columns:
        type: number
      layer:
        type: number
      collapseBelow:
        type: number
      stackBelow:
        type: number
      style:
        $ref: '#/types/StyleBlock'
      childRegions:
        type: array
        items:
          $ref: '#/types/LayoutNode'
      childSlots:
        type: array
        items:
          $ref: '#/types/ComponentSlotRef'

  ComponentSlotRef:
    type: object
    description: Reference to a component in the flat component list
    required:
      - index
      - span
    properties:
      index:
        type: number
      span:
        type: number
      colSpan:
        type: number
      rowSpan:
        type: number

  ComponentEntry:
    type: object
    description: A component extracted from the tree with its region path
    required:
      - component
      - regionPath
    properties:
      component:
        $ref: '#/types/Component'
      regionPath:
        type: string

  SplitResult:
    type: object
    description: Result of splitting a PageTree
    required:
      - layout
      - components
    properties:
      layout:
        type: array
        items:
          $ref: '#/types/LayoutNode'
      components:
        type: array
        items:
          $ref: '#/types/ComponentEntry'
      styles:
        $ref: '#/types/StyleTokens'
      data:
        type: object
        additionalProperties: true

  # ── Layout Output ──

  ContainerNode:
    type: object
    description: A layout container with CSS properties — output of the arranger
    required:
      - id
      - layoutType
      - direction
    properties:
      id:
        type: string
      layoutType:
        type: string
        enum:
          - flex
          - grid
      direction:
        type: string
        enum:
          - row
          - column
      gap:
        type: number
      justify:
        $ref: '#/types/Justify'
      layer:
        type: number
      columns:
        type: number
      collapseBelow:
        type: number
      stackBelow:
        type: number
      hidden:
        type: boolean
      style:
        $ref: '#/types/StyleBlock'
      children:
        type: array
        items:
          $ref: '#/types/ContainerChild'

  ContainerChild:
    type: object
    description: Either a nested container or a component slot
    properties:
      container:
        $ref: '#/types/ContainerNode'
      slot:
        $ref: '#/types/ComponentSlot'

  ComponentSlot:
    type: object
    description: A placeholder in the container tree for a component
    required:
      - componentId
    properties:
      componentId:
        type: string
      span:
        type: number
      colSpan:
        type: number
      rowSpan:
        type: number

  ContainerUpdate:
    type: object
    description: A diff describing a layout change from resize recalculation
    required:
      - type
      - containerId
    properties:
      type:
        type: string
        enum:
          - hide
          - show
          - change-direction
          - update-spans
      containerId:
        type: string
      newDirection:
        type: string

  # ── Data ──

  ProviderResult:
    type: object
    description: Standard return shape from a data provider
    required:
      - loading
    properties:
      data:
        type: object
        additionalProperties: true
      loading:
        type: boolean
      error:
        type: string

  HydrationResult:
    type: object
    description: Result of resolving one $reference
    required:
      - path
      - resolved
    properties:
      path:
        type: string
      resolved:
        type: boolean
      value:
        type: string

  # ── Errors ──

  ParseError:
    type: object
    description: Error from YAML parsing
    required:
      - message
    properties:
      message:
        type: string
      line:
        type: number
      column:
        type: number

  ValidationError:
    type: object
    description: Error from validation — includes path to the problematic field
    required:
      - message
      - path
    properties:
      message:
        type: string
      path:
        type: string

  # ── Simple Types ──

  Props:
    type: object
    description: Key-value map of component props
    additionalProperties: true

  StyleBlock:
    type: object
    description: CSS style overrides
    additionalProperties: true

  StyleTokens:
    type: object
    description: Global style tokens defined in the YAML style section
    additionalProperties: true

  DataDeclarations:
    type: object
    description: Maps data names to provider names
    additionalProperties: true
